<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Dashboard - TeamZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            background-image: url('bgimage.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-container {
            padding-top: 80px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 20px;
        }

        .team-info {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .team-members {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }

        .member-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .member-card {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .nav-button {
            background-color: transparent;
            border: 2px solid transparent;
            border-radius: 25px;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s, border-color 0.3s;
            text-transform: uppercase;
        }

        .nav-button:hover {
            background-color: #f0f0f0;
            color: #111;
            border-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-title">
            <i class="fas fa-users"></i>
            <h1>TeamZ</h1>
        </div>
        <nav>
            <a href="index.html" class="nav-button">Home</a>
            <a href="about.html" class="nav-button">About</a>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="team-info">
            <h2>Team Information</h2>
            <div id="teamDetails"></div>
        </div>
        <div class="team-members">
            <h2>Team Members</h2>
            <div class="member-list" id="memberList"></div>
        </div>
    </div>

    <script>
        async function loadTeamData() {
            const urlParams = new URLSearchParams(window.location.search);
            const teamCode = urlParams.get('team');

            if (!teamCode) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`/api/teams/${teamCode}`);
                const data = await response.json();

                document.getElementById('teamDetails').innerHTML = `
                    <h3>${data.name}</h3>
                    <p>${data.description}</p>
                    <p>Category: ${data.category}</p>
                `;

                const memberList = document.getElementById('memberList');
                memberList.innerHTML = data.members.map(member => `
                    <div class="member-card">
                        <i class="fas fa-user"></i>
                        <p>${member}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading team data:', error);
            }
        }

        loadTeamData();
    </script>
</body>
</html>
