
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TeamZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background-image: url('bgimage.jpg');
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .auth-container {
            background: rgba(0,0,0,0.8);
            padding: 2rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-button {
            width: 100%;
            padding: 1rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 0.5rem;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-size: 1rem;
        }

        .auth-button:hover {
            opacity: 0.9;
        }

        .input-group {
            margin: 1rem 0;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            background: rgba(255,255,255,0.1);
            color: white;
            margin-top: 0.5rem;
        }

        .error-message {
            color: #ff4444;
            margin-top: 0.5rem;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 id="authTitle">Welcome to TeamZ</h2>
        <div id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <button onclick="handleLogin()" class="auth-button">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
            <p style="margin-top: 1rem">
                Don't have an account? <a href="#" onclick="toggleForm()" style="color: #4CAF50">Sign Up</a>
            </p>
        </div>
    </div>

    <script>
        let isLoginForm = true;

        function toggleForm() {
            isLoginForm = !isLoginForm;
            document.getElementById('authTitle').textContent = isLoginForm ? 'Welcome to TeamZ' : 'Create Account';
            document.querySelector('.auth-button').innerHTML = isLoginForm ? 
                '<i class="fas fa-sign-in-alt"></i> Sign In' : 
                '<i class="fas fa-user-plus"></i> Sign Up';
            document.querySelector('p').innerHTML = isLoginForm ?
                'Don\'t have an account? <a href="#" onclick="toggleForm()" style="color: #4CAF50">Sign Up</a>' :
                'Already have an account? <a href="#" onclick="toggleForm()" style="color: #4CAF50">Sign In</a>';
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = isLoginForm ? '/api/login' : '/api/signup';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showSuccess(data.message);
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', email);
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Operation failed. Please try again.');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }
    </script>
</body>
</html>
