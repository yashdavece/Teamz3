<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TeamZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <h2 id="authTitle">Welcome to TeamZ</h2>
        <div id="loginForm">
            <div class="input-group">
                <label>First Name</label>
                <input type="text" id="firstName" required placeholder="Enter your first name">
            </div>
            <div class="input-group">
                <label>Last Name</label>
                <input type="text" id="lastName" required placeholder="Enter your last name">
            </div>
            <div class="input-group">
                <label>Role</label>
                <select id="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="developer">Developer</option>
                    <option value="designer">Designer</option>
                    <option value="manager">Project Manager</option>
                    <option value="analyst">Business Analyst</option>
                    <option value="tester">QA Tester</option>
                </select>
            </div>
            <div id="errorMessage" class="error-message"></div>
            <button onclick="handleLogin()" class="auth-button">
                <i class="fas fa-sign-in-alt"></i> Continue
            </button>
            <div id="successMessage" class="success-message"></div>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const role = document.getElementById('role').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ firstName, lastName, role })
                });

                const data = await response.json();
                if (response.ok) {
                    document.getElementById('successMessage').innerText = data.message;
                    localStorage.setItem('isLoggedIn', 'true');
                    // Optionally redirect to a dashboard or another page
                } else {
                    document.getElementById('errorMessage').innerText = data.error;
                }
            } catch (error) {
                console.error('Login error:', error);
            }
        }
    </script>
</body>
</html>
