
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TeamZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://auth.util.repl.co/script.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background-image: url('bgimage.jpg');
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .auth-container {
            background: rgba(0,0,0,0.8);
            padding: 2rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-button {
            width: 100%;
            padding: 1rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 0.5rem;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-size: 1rem;
        }

        .auth-button.google { background: #DB4437; }
        .auth-button.github { background: #333; }

        .input-group {
            margin: 1rem 0;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            background: rgba(255,255,255,0.1);
            color: white;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Welcome to TeamZ</h2>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <button class="auth-button">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <button class="auth-button google">
            <i class="fab fa-google"></i> Continue with Google
        </button>
        <button class="auth-button github">
            <i class="fab fa-github"></i> Continue with GitHub
        </button>
        <p style="margin-top: 1rem">
            Don't have an account? <a href="#" style="color: #4CAF50">Sign Up</a>
        </p>
    </div>
</body>
</html>
